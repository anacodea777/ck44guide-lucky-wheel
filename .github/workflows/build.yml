name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Check the APK requests no permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "uses-permission" permissions.txt; then
            echo "::error::APK requests permissions"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lucky-wheel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
